remediation_cq07:
  dispatch: dispatch/10b-configsmith-cq07.md
  human_approved_plan_revision: "realmac/components/innovation-card thin proxy (sling:resourceSuperType=realmac/components/teaser), created in parallel by blockwright, gives the 4 card teasers a distinct resourceType from the hero so AEM's runtime Content Policy resolution stops conflating the two author-droppable nesting depths under one resourceType."
  root_cause_recap: "AEM's runtime Content Policy resolution does not differentiate realmac/components/teaser at 2 different author-droppable nesting depths (hero vs. card-grid) under landing-page's mapping tree — live-confirmed by Auditron/Program Agent: all 4 cards resolved the hero's policy (h1, styleId 20260828101) instead of their own (h3, styleId 20260828104)."
  fixes_applied:
    - id: fix_1
      description: "policy_landing_card_grid allowlist re-keyed from teaser to the new proxy — least-privilege, also prevents an author from ever re-dropping a plain teaser into card-grid and re-triggering the ambiguity."
      file: ui.content/src/main/content/jcr_root/conf/realmac/settings/wcm/policies/.content.xml
      node: realmac/components/container/policy_landing_card_grid
      diff:
        before: 'components="[realmac/components/teaser]"'
        after: 'components="[realmac/components/innovation-card]"'
    - id: fix_2
      description: "landing-page template mapping tree, card-grid's nested fallback segment re-keyed from teaser to innovation-card (element name = resourceType-fallback key) and cq:policy repointed to the new resourceType's own policy namespace. Outer parsys-level hero mapping (one level up) explicitly left untouched."
      file: ui.content/src/main/content/jcr_root/conf/realmac/settings/wcm/templates/landing-page/policies/.content.xml
      path: jcr:content/root/container/container/realmac/components/container/realmac/components (card-grid's nested segment)
      diff:
        before: '<teaser cq:policy="realmac/components/teaser/policy_landing_card_teaser" .../>'
        after: '<innovation-card cq:policy="realmac/components/innovation-card/policy_landing_card_teaser" .../>'
    - id: fix_3
      description: "policy_landing_card_teaser definition MOVED (not duplicated) from under the <teaser> component node to a new sibling <innovation-card> component node in the consolidated policies file, mirroring the file's existing per-component-type nesting convention. policy_landing_hero_teaser left exactly where it was, under <teaser>."
      file: ui.content/src/main/content/jcr_root/conf/realmac/settings/wcm/policies/.content.xml
      diff:
        before: "policy_landing_card_teaser nested under <teaser jcr:primaryType=\"nt:unstructured\"> alongside policy_1575031387650 and policy_landing_hero_teaser"
        after: "policy_landing_card_teaser nested under new sibling node <innovation-card jcr:primaryType=\"nt:unstructured\"> (only child); <teaser> now contains only policy_1575031387650 and policy_landing_hero_teaser; zero duplication — grepped both nodes to confirm exactly one occurrence of policy_landing_card_teaser in the file"
  hero_mapping_untouched_confirmation:
    verified: true
    method: "re-read both files directly after all 3 edits"
    detail: "templates/landing-page/policies/.content.xml jcr:content/root/container/container/realmac/components/teaser still reads cq:policy=\"realmac/components/teaser/policy_landing_hero_teaser\" with sling:resourceType=\"wcm/core/components/policies/mapping\" — byte-identical to pre-fix state, one level up from the card-grid's own <realmac><components> segment, still keys on plain teaser. policies/.content.xml's <teaser> node still contains policy_landing_hero_teaser (h1, styleId 20260828101, cq:styleClasses=cmp-teaser--hero) unchanged."
  scope_confirmation:
    ui_apps_touched: false
    core_touched: false
    ui_frontend_touched: false
    pom_files_touched: false
    filter_xml_touched: false
    mvn_invoked: false
