  gate_iteration: 3
  findings_addressed: [CQ-06, CQ-07]

  cq_06:
    title: "data-sly-test co-located with data-sly-repeat on the same element in site-footer.html suppresses the entire repeated block"
    file: ui.apps/src/main/content/jcr_root/apps/realmac/components/site-footer/site-footer.html
    root_cause: "Per HTL block-statement execution order, data-sly-test is evaluated before data-sly-repeat binds its loop variable when both sit on one element, so the test always evaluates against an undefined column/link and the block is always suppressed. All 4 authored footer link columns rendered as a completely empty div.cmp-site-footer__columns."
    fix: "Mirrored the already-correct social-list idiom: data-sly-repeat stays on the wrapper element only; data-sly-test moves onto a nested non-rendering sly element inside it, so the test now evaluates after the loop variable is bound. Applied to both the column nav and the nested link li."
    lines_changed_only_these: true
    other_content_in_file_touched: false

  cq_07:
    title: "AEM runtime Content Policy resolution does not differentiate realmac/components/teaser at 2 different author-droppable nesting depths (hero vs card-grid); all 4 cards resolved the hero policy (h1, styleId 101, zero card styling)"
    approach: "Option A, thin sling:resourceSuperType proxy component, human-approved (DECISIONS.md 2026-08-28T19:55Z)"
    component_created:
      name: innovation-card
      path: ui.apps/src/main/content/jcr_root/apps/realmac/components/innovation-card/.content.xml
      resource_super_type: realmac/components/teaser
      component_group: "Realmac - Content"
      files_authored: [ui.apps/src/main/content/jcr_root/apps/realmac/components/innovation-card/.content.xml]
      files_deliberately_not_created: [html, cq_dialog, cq_editConfig, SlingModel, unit_test]
      reason_pure_proxy_sufficient: "innovation-card inherits 100 percent of realmac/components/teaser's HTL, dialog, and Java Sling Model via the sling:resourceSuperType chain (Sling Resource Merger resolves scripts/dialogs by walking resourceSuperType). realmac/components/teaser itself carries no HTL/dialog of its own; it is itself a pure proxy of core/wcm/components/teaser/v2/teaser with imageDelegate=realmac/components/image, and its cq_editConfig.xml is explicitly cq:inherit=true, confirming the project's own established convention that a proxy-only .content.xml is sufficient for this chain. Pointing at realmac/components/teaser (not directly at Core's v2 teaser) preserves the project's imageDelegate override and any future project-level teaser customization automatically. No concrete reason found to author anything beyond the single .content.xml."
    scss_impact_confirmation:
      claim: "No SCSS changes needed."
      verified: true
      evidence: "Grepped ui.frontend for innovation-card: single hit at ui.frontend/src/main/webpack/components/_teaser.scss line 67, selector .cmp-teaser--innovation-card, targeting Core Teaser's own BEM output classes (.cmp-teaser, .cmp-teaser__ children). Since innovation-card resolves the same inherited HTL as realmac/components/teaser (Core Teaser v2's HTL, unmodified), an innovation-card instance's rendered DOM emits the identical cmp-teaser/cmp-teaser__ class structure as a plain teaser instance; the only difference is which cq:styleIds/policy resolves against the new distinct resourceType, not the DOM shape. Existing SCSS partial requires zero edits; not touched this iteration."
      no_dom_divergence_found: true
