remediation:
  gate_iteration: 1
  findings_addressed: [CQ-01, CQ-02]
  finding_not_owned: { id: CQ-03, status: resolved-by-human, note: "pre-existing local-build-only Zscaler workaround across pom.xml / ui.apps/pom.xml / ui.frontend/pom.xml; out of scope, not touched" }

  cq_01:
    title: "data-sly-list misuse in site-footer.html"
    file: ui.apps/src/main/content/jcr_root/apps/realmac/components/site-footer/site-footer.html
    fix: "Changed both occurrences of data-sly-list (on the repeating <nav class=cmp-site-footer__column> and the repeating <li> inside the link list) to data-sly-repeat, since data-sly-list repeats only a host element's CONTENT, not the host element itself. Left site-header.html's own data-sly-list.link (correctly placed on the <ul> wrapper, repeating <li> as content) untouched."
    diff_summary:
      - "line ~10: data-sly-list.column=\"${model.columns}\" -> data-sly-repeat.column=\"${model.columns}\" on <nav class=\"cmp-site-footer__column\">"
      - "line ~14: data-sly-list.link=\"${column.links}\" -> data-sly-repeat.link=\"${column.links}\" on <li>"
    lines_changed_only_these: true

  cq_02:
    title: "HTL unknown-option build failure on site-header.html (navigationRoot/structureDepth data-sly-resource options not in allowedExpressionOptions)"
    option_used: B
    option_a_considered: true
    option_a_rejected_reason: "Not needed — Option B (model-built synthetic resource) worked cleanly with the existing project idiom (ResourceWrapper + ValueMapDecorator, already-used SlingObject-injected Resource field), so no htl-maven-plugin pom.xml change was required at all. Falling back to Option A would have meant editing ui.apps/pom.xml unnecessarily, which the human flagged as risky given the adjacent commented-out realmac.ui.frontend dependency block."
    files_changed:
      - core/src/main/java/com/realmac/aem/core/models/SiteHeaderModel.java
      - core/src/test/java/com/realmac/aem/core/models/SiteHeaderModelTest.java
      - ui.apps/src/main/content/jcr_root/apps/realmac/components/site-header/site-header.html
    diff_summary:
      - "SiteHeaderModel.java: added NAVIGATION_RESOURCE_TYPE constant, a navigationResource field, and buildNavigationResource() — builds a ResourceWrapper(resource) subclass overriding getValueMap() (backed by a ValueMapDecorator pre-populated with sling:resourceType=realmac/components/navigation, navigationRoot, structureDepth), getResourceType(), and adaptTo(ValueMap.class). Wired into init() via @PostConstruct. Added public Resource getNavigationResource() accessor."
      - "SiteHeaderModelTest.java: added testNavigationResource_carriesNavigationRootStructureDepthAndResourceType() asserting the returned resource's getResourceType() and ValueMap (navigationRoot, structureDepth, sling:resourceType) plus its ValueMap.class adaptTo path."
      - "site-header.html: replaced the synthetic data-sly-resource with custom @-options (resourceType/navigationRoot/structureDepth) with a plain data-sly-resource=\"${model.navigationResource}\" reference — no expression options at all, so htl-maven-plugin's allowedExpressionOptions validation is never triggered for this line. Updated the top comment to reflect the model-built resource."
    ui_apps_pom_xml_touched: false

  untouchable_files_confirmation:
    root_pom_xml_touched: false
    ui_frontend_pom_xml_touched: false
    ui_apps_pom_xml_touched: false
    ui_apps_pom_xml_commented_dependency_block_touched: false
