        finding: "policies/.content.xml is ONE docview file serializing the entire /conf/realmac/settings/wcm/policies/realmac subtree (confirmed: only .content.xml + _rep_policy.xml in that dir, no per-node subfolders). git diff confirms this run added 5 new policy_landing_* nodes (intro_text, content, card_grid, hero_teaser, card_teaser) + a new button/policy_landing_button node (=6 new policies), and amended the pre-existing policy_1575040440977 (\"XF Root\") components attribute. Because the aggregate's top-level node (policies/realmac) already existed before this run, mode=\"merge\" treats the whole aggregate as already-present and neither adds the new children nor updates the amended property — matching Auditron's live evidence (5/6 policies 404, XF-Root amendment not live)."
        needs_new_entry: true
        entry_added: '<filter root="/conf/realmac/settings/wcm/policies/realmac" mode="replace"/>'
        scoping_rationale: "Scoped to the realmac node under policies (not the whole /conf/realmac tree). The package's copy of this subtree is the complete current definition (all pre-existing untouched policies — image, title, page, download, form, languagenavigation, experiencefragment, the original container/teaser policies — plus the 6 new + 1 amended), so a replace here is a clean full reinstall of exactly what's in source; nothing outside this run's changes is altered in effect even though the node is technically cleared-then-reinstalled. A further split into 4 per-component-type entries (container/teaser/text/button) was considered and rejected as unnecessary complexity for an identical outcome."
      - area: "2. landing-page template subtree"
